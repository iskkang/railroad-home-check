name: Transportation noise data
on:
  push:
    branches: [noise-data]
    paths: ['scripts/fetch-noise.mjs', 'lib/noise.js', '.github/workflows/noise-data.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/fetch-noise.mjs
      - name: Commit data
        run: |
          git config user.name "rail-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/noise || true
          git diff --cached --quiet || (git commit -m "Refresh noise data [skip ci]" && git push)
