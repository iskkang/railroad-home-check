name: Climate and hazard data
on:
  push:
    branches: [climate-data]
    paths: ['scripts/fetch-climate.mjs', '.github/workflows/climate-data.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/fetch-climate.mjs
      - name: Commit data
        run: |
          git config user.name "rail-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/climate || true
          git diff --cached --quiet || (git commit -m "Refresh climate data [skip ci]" && git push)
