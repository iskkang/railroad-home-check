name: Rail city data
# Fetches FRA / Census data for the /trains/ city pages (the build sandbox cannot reach these APIs).
on:
  push:
    branches: [data-refresh]
    paths: ['scripts/fetch-rail-cities.mjs', '.github/workflows/rail-data.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Census population and place centers
        run: |
          curl -fsSL https://www2.census.gov/programs-surveys/popest/datasets/2020-2023/cities/totals/sub-est2023.csv -o /tmp/pop.csv
          curl -fsSL https://www2.census.gov/geo/docs/maps-data/data/gazetteer/2023_Gazetteer/2023_Gaz_place_national.zip -o /tmp/gaz.zip
          unzip -p /tmp/gaz.zip > /tmp/gaz.txt
          wc -l /tmp/pop.csv /tmp/gaz.txt
      - run: node scripts/fetch-rail-cities.mjs
      - name: Commit data
        run: |
          git config user.name "rail-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/rail-cities
          git diff --cached --quiet || (git commit -m "Refresh rail city data [skip ci]" && git push)
