name: IndexNow (Bing, Naver, Yandex)
# Sends every sitemap URL to IndexNow after a deploy that changes the sitemap.
on:
  push:
    branches: [main]
    paths: ['sitemap.xml']
  workflow_dispatch:
jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the Vercel deploy to serve the key file
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "https://railroad-home-check.vercel.app/4404fff1bc3019e0aaecfdd423e3acac.txt" | grep -q "4404fff1bc3019e0aaecfdd423e3acac"; then echo "key live"; exit 0; fi
            sleep 20
          done
          echo "key file not live"; exit 1
      - name: Submit sitemap URLs
        run: |
          python3 - <<'PY'
          import json, re, urllib.request, urllib.error
          urls = re.findall(r'<loc>([^<]+)</loc>', open('sitemap.xml').read())
          body = json.dumps({"host": "railroad-home-check.vercel.app", "key": "4404fff1bc3019e0aaecfdd423e3acac",
                             "keyLocation": "https://railroad-home-check.vercel.app/4404fff1bc3019e0aaecfdd423e3acac.txt", "urlList": urls}).encode()
          for ep in ["https://www.bing.com/indexnow", "https://api.indexnow.org/indexnow"]:
              req = urllib.request.Request(ep, data=body, headers={"Content-Type": "application/json; charset=utf-8"})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      print(ep, r.status, len(urls), "urls", r.read()[:300])
              except urllib.error.HTTPError as e:
                  print(ep, e.code, e.read()[:500])
          PY
